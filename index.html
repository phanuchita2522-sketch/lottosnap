<script>
'use strict';
/* ============================================================
   LottoSnap — เว็บแอปไฟล์เดียว (HTML/JS + Tailwind)
   ฟรี · ตรวจผลรางวัลอย่างเดียว · ไม่มีการซื้อขายหรือพนัน
   ============================================================ */

/* ---------- ตั้งค่าโฆษณา (ใส่โค้ดโฆษณาจริงที่ mount) ---------- */
const AD_CONFIG = {
  enabled: true,          // โฆษณาคั่นก่อนใช้กล้อง/เสียง
  seconds: 5,             // เวลารอก่อนกดไปต่อ
  // ใส่โค้ดโฆษณาจริงของคุณที่นี่ (เช่น AdSense / GPT / SDK ของเครือข่ายโฆษณา)
  // el = กล่องโฆษณา, place = 'camera' | 'voice'
  mount(el, place) {
    el.innerHTML = '<div class="p-6 text-slate-500 text-sm">[พื้นที่โฆษณา — ' + place + ']<br>วางโค้ดโฆษณาใน AD_CONFIG.mount()</div>';
  }
};
const DEFAULT_API = ''; // ว่าง = ใช้ชุดข้อมูลชุมชนในตัว | หรือ URL ของบอท/API ที่มี /latest /list/{หน้า} /lotto/{id} /other/{ชนิด}

/* ---------- Utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n ? Number(n).toLocaleString('th-TH') + ' บาท' : '—';
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ls_' + k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem('ls_' + k, JSON.stringify(v)) } catch (e) { toast('พื้นที่จัดเก็บเต็ม/ถูกบล็อก') } }
};
const BTN = 'inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-95 disabled:opacity-50';
const BP = BTN + ' bg-teal-600 text-white hover:bg-teal-700';
const BS = BTN + ' bg-slate-100 text-slate-800 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-100 dark:hover:bg-slate-600';
const BD = BTN + ' bg-rose-600 text-white hover:bg-rose-700';
const INP = 'w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-500';
const CARD = 'rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm p-4';
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 3200) };

/* ---------- ชนิดหวย ---------- */
const LOTTO = {
  thai:   { name: 'หวยรัฐบาลไทย', icon: '🇹🇭', len: [6], max: 6 },
  gsb:    { name: 'ออมทรัพย์ ธ.ก.ส.', icon: '🏦', len: [7, 6], max: 10 },
  lao:    { name: 'หวยลาว', icon: '🇱🇦', len: [6, 4, 3, 2], max: 6 },
  hanoi:  { name: 'หวยฮานอย', short: 'ปกติ (XSMB ทางการ)', icon: '🇻🇳', len: [5, 4], max: 5 },
  hanoi_sp:  { name: 'ฮานอยพิเศษ', short: 'พิเศษ', sub: 'hanoi', icon: '🇻🇳', len: [4, 3, 2], max: 4 },
  hanoi_vip: { name: 'ฮานอย VIP', short: 'VIP', sub: 'hanoi', icon: '🇻🇳', len: [4, 3, 2], max: 4 },
  hanoi_ex:  { name: 'ฮานอยเฉพาะกิจ', short: 'เฉพาะกิจ', sub: 'hanoi', icon: '🇻🇳', len: [4, 3, 2], max: 4 },
};
const G = (id, name, match, reward = 0, numbers = []) => ({ id, name, match, reward, numbers });
function presetGroups(lot) {
  switch (lot) {
    case 'thai': return [G('prizeFirst', 'รางวัลที่ 1', 'full', 6000000), G('prizeFirstNear', 'ข้างเคียงรางวัลที่ 1', 'full', 100000), G('prizeSecond', 'รางวัลที่ 2', 'full', 200000), G('prizeThird', 'รางวัลที่ 3', 'full', 80000), G('prizeForth', 'รางวัลที่ 4', 'full', 40000), G('prizeFifth', 'รางวัลที่ 5', 'full', 20000), G('runningNumberFrontThree', 'เลขหน้า 3 ตัว', 'first', 4000), G('runningNumberBackThree', 'เลขท้าย 3 ตัว', 'last', 4000), G('runningNumberBackTwo', 'เลขท้าย 2 ตัว', 'last', 2000)];
    case 'gsb': return [G('g1', 'รางวัลที่ 1', 'full'), G('g3', 'เลขท้าย 3 ตัว', 'last'), G('g2', 'เลขท้าย 2 ตัว', 'last')];
    case 'lao': return [G('l6', 'เลข 6 ตัว', 'full'), G('l4', 'เลขท้าย 4 ตัว', 'last'), G('l3', 'เลขท้าย 3 ตัว (3 ตัวบน)', 'last'), G('l2', 'เลขท้าย 2 ตัว (2 ตัวบน)', 'last'), G('l2b', '2 ตัวล่าง', 'full')];
    case 'hanoi': return [G('h3', '3 ตัวบน', 'last'), G('h2', '2 ตัวบน', 'last'), G('h2b', '2 ตัวล่าง', 'full')];
    case 'hanoi_sp': case 'hanoi_vip': case 'hanoi_ex': return [G('h4', 'เลข 4 ตัว', 'full'), G('h3', '3 ตัวบน', 'last'), G('h2', '2 ตัวบน', 'last'), G('h2b', '2 ตัวล่าง', 'full')];
  }
  return [];
}
/* ---------- ข้อมูลตัวอย่าง (ไว้ทดสอบการตรวจเมื่อดึงผลจริงไม่ได้ — ไม่ใช่ผลรางวัลจริง) ---------- */
function seeded(n, len, seed) { const out = []; let x = seed; while (out.length < n) { x = (Math.imul(x, 1103515245) + 12345) & 0x7fffffff; const v = String(x % Math.pow(10, len)).padStart(len, '0'); if (!out.includes(v)) out.push(v) } return out }
const DEMO_NUM = {
  thai: { prizeFirst: ['123456'], prizeFirstNear: ['123455', '123457'], prizeSecond: seeded(5, 6, 11), prizeThird: seeded(10, 6, 22), prizeForth: seeded(50, 6, 33), prizeFifth: seeded(100, 6, 44), runningNumberFrontThree: ['123', '789'], runningNumberBackThree: ['456', '012'], runningNumberBackTwo: ['56'] },
  gsb: { g1: ['1234567'], g3: ['567'], g2: ['67'] },
  lao: { l6: ['184036'], l4: ['4036'], l3: ['036'], l2: ['36'], l2b: ['40'] },
  hanoi: { h3: ['345'], h2: ['45'], h2b: ['90'] },
  hanoi_sp: { h4: ['1234'], h3: ['234'], h2: ['34'], h2b: ['56'] },
  hanoi_vip: { h4: ['1234'], h3: ['234'], h2: ['34'], h2b: ['56'] },
  hanoi_ex: { h4: ['1234'], h3: ['234'], h2: ['34'], h2b: ['56'] },
};
const DEMO_HINT = { thai: '123456', gsb: '1234567', lao: '184036', hanoi: '12345', hanoi_sp: '1234', hanoi_vip: '1234', hanoi_ex: '1234' };
function demoResult(lot) {
  const groups = presetGroups(lot).map(g => Object.assign({}, g, { numbers: (DEMO_NUM[lot] || {})[g.id] || [] }));
  return { lottery: lot, date: 'ตัวอย่าง (เดโม)', id: 'demo', groups, source: 'demo' };
}
const MATCH_LABEL = { full: 'ตรงทั้งหมด', last: 'ตรงเลขท้าย', first: 'ตรงเลขหน้า' };

/* ---------- State ---------- */
const S = {
  view: 'home', lottery: LS.get('lottery', 'thai'),
  set: Object.assign({ theme: 'auto', pre: true, api: DEFAULT_API, notif: true, scale: 1, remind: false, lead: 15, sched: {}, web: true, publicProxy: true, proxy: '' }, LS.get('settings', {})),
  profile: Object.assign({ name: '', avatar: '🙂', img: null }, LS.get('profile', {})),
  notifs: LS.get('notifs', []), checks: LS.get('checks', []), mres: LS.get('mres', {}),
  tickets: [{ v: '', src: 'manual', ok: true }], cands: [], notes: [],
  draw: null, drawState: 'idle', lastCheck: null, useManual: false, demo: {},
  listCache: [], listPage: 0, listEnd: false, drawCache: {}, stats: null, statsBusy: false,
  hTab: 'stats', statDay: null, webBusy: {}, webErr: {}, del: LS.get('mresDel', {}), started: Date.now(), uid: 0, edit: null,
};
if (!LOTTO[S.lottery]) S.lottery = 'thai'; delete S.mres.yeekee; delete S.mres.my; delete S.del.my; // ค่าเก่าจากเวอร์ชันที่เคยมียี่กีและหวยมาเลย์
const saveSet = () => LS.set('settings', S.set);
if (/rayriffy\.com/.test(S.set.api || '')) { S.set.api = ''; saveSet() } // ย้ายค่าเก่า: โดเมนนี้เลิกให้บริการแล้ว

/* ---------- ผลรางวัล ---------- */
function curResult() {
  if (S.demo[S.lottery]) return S.demo[S.lottery];
  if (S.lottery === 'thai' && S.draw && !S.useManual) return S.draw;
  const m = S.mres[S.lottery]; return (m && m[0]) || null;
}
const grp = (r, id) => (r.groups.find(g => g.id === id) || { numbers: [] });
function normThai(j, id) {
  const r = j.response || j.data || j;
  if (!r || !Array.isArray(r.prizes)) throw new Error('รูปแบบข้อมูลจาก API ไม่รองรับ');
  const groups = r.prizes.map(p => G(p.id, p.name, 'full', +p.reward || 0, (p.number || []).map(String)));
  (r.runningNumbers || []).forEach(p => groups.push(G(p.id, p.name, /Front/i.test(p.id) ? 'first' : 'last', +p.reward || 0, (p.number || []).map(String))));
  return { lottery: 'thai', date: r.date || '', id: id || r.id || r.endpoint || '', groups, source: 'api' };
}
function netErr(err) { const net = err && (err.name === 'AbortError' || err instanceof TypeError || /Failed to fetch|NetworkError/i.test(err.message)); return net ? 'เชื่อมต่อแหล่งข้อมูลไม่ได้ (ออฟไลน์ / ถูกบล็อก / เซิร์ฟเวอร์ล่ม)' : (err ? err.message : 'ไม่ทราบสาเหตุ') }
const bases = () => { const b = (S.set.api || '').trim().replace(/\/+$/, ''); return b ? [b] : [] };
async function jget(path) { // path เริ่มด้วย "/" — ลองแหล่งที่ตั้งไว้ก่อน แล้วค่อยลองค่าเริ่มต้น
  let err;
  if (!bases().length) throw new Error('ยังไม่ได้ตั้งแหล่งข้อมูลส่วนตัว');
  for (const b of bases()) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    try { const r = await fetch(b + path, { cache: 'no-store', signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json() }
    catch (e) { err = e } finally { clearTimeout(t) }
  }
  throw new Error(netErr(err));
}
/* ---------- ชุดข้อมูลชุมชน (ค่าเริ่มต้น): github.com/huayreview/thai-lottery-results — CC BY 4.0 ---------- */
const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const DS_URLS = ['https://raw.githubusercontent.com/huayreview/thai-lottery-results/main/thai-lottery-results.json', 'https://cdn.jsdelivr.net/gh/huayreview/thai-lottery-results@main/thai-lottery-results.json'];
const DS_MAP = { prizeFirst: 'first_prize', prizeFirstNear: 'near_first_prize', prizeSecond: 'second_prize', prizeThird: 'third_prize', prizeForth: 'fourth_prize', prizeFifth: 'fifth_prize', runningNumberFrontThree: 'front_three_digits', runningNumberBackThree: 'last_three_digits', runningNumberBackTwo: 'last_two_digits' };
const DS_LEN = { runningNumberFrontThree: 3, runningNumberBackThree: 3, runningNumberBackTwo: 2 };
let DS = null;
const thaiDateISO = iso => { const [y, m, d] = iso.split('-').map(Number); return d + ' ' + TH_MONTHS[m - 1] + ' ' + (y + 543) };
async function loadDataset() {
  if (DS) return DS;
  let err;
  for (const u of DS_URLS) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(u, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); if (!j || !Array.isArray(j.draws) || !j.draws.length) throw new Error('รูปแบบชุดข้อมูลไม่ถูกต้อง');
      DS = j.draws.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d.draw_date)).sort((a, b) => a.draw_date < b.draw_date ? 1 : -1); return DS;
    } catch (e) { err = e } finally { clearTimeout(t) }
  }
  throw new Error(netErr(err));
}
function fromDS(d) {
  const groups = presetGroups('thai').map(g => {
    const len = DS_LEN[g.id] || 6;
    return Object.assign({}, g, { numbers: (d[DS_MAP[g.id]] || []).map(x => String(x).padStart(len, '0')) });

}

/* ---------- เตือนใกล้เวลาออกผล ----------

const DAYN = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

  thai: { time: '14:30', dates: '1,16' },

  if (typeof Tesseract === 'undefined') throw new Error('โหลด Tesseract.js ไม่สำเร็จ (ตรวจอินเทอร์เน็ต)');

function toCanvas(img) { const c = document.createElement('canvas'); c.width = img.naturalWidth || img.videoWidth || img.width; c.height = img.naturalHeight || img.videoHeight || img.height; c.getContext('2d').drawImage(img, 0, 0); return c }
function prep(src) {
  let w = src.width, h = src.height; const sc = w < 1000 ? 1000 / w : (w > 1800 ? 1800 / w : 1);
  w = Math.round(w * sc); h = Math.round(h * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(src, 0, 0, w, h);
  if (!S.set.pre) return c;
  const d = x.getImageData(0, 0, w, h), p = d.data, g = new Uint8Array(w * h); let mn = 255, mx = 0;
  for (let i = 0, j = 0; i < p.length; i += 4, j++) { const v = (p[i] * .299 + p[i + 1] * .587 + p[i + 2] * .114) | 0; g[j] = v; if (v < mn) mn = v; if (v > mx) mx = v }

}
function readQR(cv, maxSide = 1400) {
  if (typeof jsQR === 'undefined') return null;
  const sc = Math.min(1, maxSide / Math.max(cv.width, cv.height)), w = Math.round(cv.width * sc), h = Math.round(cv.height * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(cv, 0, 0, w, h);

/* ดึงเฉพาะตัวเลข เรียงตามลำดับที่อ่านได้ — ไม่สลับ ไม่เรียงใหม่ */
function extractNums(text) {
  const out = [], lens = LOTTO[S.lottery].len;
  String(text).split(/\n+/).forEach(line => {
    const runs = line.match(/\d+/g) || [];
    runs.forEach(r => { if (r.length >= 2) out.push(r) });
    const j = runs.join('');
    if (runs.length > 1 && lens.includes(j.length)) out.push(j);
  });
  return out;
}
function addCands(nums, src, label) {
  const lens = LOTTO[S.lottery].len;
  nums.forEach(n => { if (!S.cands.some(c => c.v === n)) S.cands.push({ id: ++S.uid, v: n, src, label, checked: lens.includes(n.length) }) });
}
function setProg(msg, p) {
  const el = $('#prog'); if (!el) return;
  el.innerHTML = msg ? `<div class="text-sm mb-1">${esc(msg)}</div><div class="h-2 rounded bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-2 bg-teal-500" style="width:${Math.round((p || 0) * 100)}%"></div></div>` : '';
}
async function runPipeline(cv, label) {
  setProg(label + ': กำลังอ่าน QR…', .05);
  try {
    const qr = readQR(cv);
    if (qr && qr.data) { S.notes.push('QR (' + label + '): ' + qr.data); addCands(extractNums(qr.data), 'QR', label); toast('พบ QR code') }
  } catch (e) { }
  try {
    setProg(label + ': กำลังอ่านตัวเลข (OCR)…', .1);
    const w = await getWorker(); ocrProg = p => setProg(label + ': OCR ' + Math.round(p * 100) + '%', .1 + p * .9);
    const r = await w.recognize(prep(cv)); ocrProg = null;
    const nums = extractNums(r.data.text);
    S.notes.push('OCR (' + label + '): ' + r.data.text.replace(/\s+/g, ' ').trim());
    addCands(nums, 'OCR', label);
    if (!nums.length) toast('ไม่พบตัวเลข — ลองถ่ายให้ชัด ตรง และแสงพอ');
  } catch (e) { ocrProg = null; toast('OCR ผิดพลาด: ' + e.message) }
  setProg(''); renderCands();
}

const Cam = {
  stream: null, facing: 'environment', timer: null, last: '',
  async start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('เบราว์เซอร์นี้ไม่รองรับกล้อง (ต้องใช้ HTTPS)');
    if (!await adGate('camera')) return;
    try {
      this.stop(true);
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: this.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      const v = $('#vid'); if (!v) return this.stop();
      v.srcObject = this.stream; await v.play();
      $('#camOn').classList.remove('hidden'); $('#camOff').classList.add('hidden');
      this.timer = setInterval(() => this.live(), 400);
    } catch (e) { toast('เปิดกล้องไม่ได้: ' + (e.message || e.name)) }
  },
  stop(silent) {
    clearInterval(this.timer); this.timer = null;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null;
    const v = $('#vid'); if (v) v.srcObject = null;
    if (!silent) { $('#camOn')?.classList.add('hidden'); $('#camOff')?.classList.remove('hidden') }
  },
  flip() { this.facing = this.facing === 'environment' ? 'user' : 'environment'; this.stop(true); this.start() },
  live() {
    const v = $('#vid'); if (!v || !v.videoWidth || this.busy) return;
    try {
      const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
      const qr = readQR(c, 640);
      if (qr && qr.data && qr.data !== this.last) { this.last = qr.data; S.notes.push('QR (สด): ' + qr.data); addCands(extractNums(qr.data), 'QR', 'สด'); renderCands(); toast('พบ QR code'); navigator.vibrate && navigator.vibrate(60) }
    } catch (e) { }
  },
  async shot() {
    const v = $('#vid'); if (!v || !v.videoWidth) return toast('กล้องยังไม่พร้อม');
    this.busy = true; await runPipeline(toCanvas(v), 'ภาพจากกล้อง'); this.busy = false;
  }
};

const THW = { 'ศูนย์': 0, 'หนึ่ง': 1, 'เอ็ด': 1, 'สอง': 2, 'สาม': 3, 'สี่': 4, 'ห้า': 5, 'หก': 6, 'เจ็ด': 7, 'แปด': 8, 'เก้า': 9, 'zero': 0, 'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9 };
function speechDigits(s) {

  s = s.replace(re, m => ' ' + THW[m.toLowerCase()] + ' ');

}

/* ---------- Tickets ---------- */
function addTickets(list, src) {
  S.tickets = S.tickets.filter(t => t.v);
  let n = 0;
  for (const v of list) {
    if (S.tickets.length >= 10) { toast('ตรวจได้สูงสุด 10 ใบ'); break }
    S.tickets.push({ v: String(v).replace(/\D/g, '').slice(0, 12), src, ok: src === 'manual' }); n++;
  }
  if (!S.tickets.length) S.tickets.push({ v: '', src: 'manual', ok: true });
  S.lastCheck = null; return n;
}

      const items = S.listCache.slice(0, 30), out = []; let i = 0;
      await Promise.all(Array.from({ length: 4 }, async () => {
        while (i < items.length) { const k = i++, it = items[k]; try { S.drawCache[it.id] = S.drawCache[it.id] || await loadDraw(it.id); const d = S.drawCache[it.id]; if (!d.date) d.date = it.date; out[k] = d } catch (e) { } }
      }));
      S.stats = out.filter(Boolean); if (!S.stats.length) { S.stats = null; toast('โหลดสถิติไม่สำเร็จ') }
    } catch (e) { toast('โหลดสถิติไม่สำเร็จ: ' + e.message) }
    S.statsBusy = false; render();
  },
  wipe() { if (confirm('ลบข้อมูลทั้งหมดในเครื่อง (ประวัติ, ผลที่กรอก, โปรไฟล์, ตั้งค่า)?')) { Object.keys(localStorage).filter(k => k.startsWith('ls_')).forEach(k => localStorage.removeItem(k)); sessionStorage.clear(); location.reload() } }
};

/* ---------- Render / Router ---------- */
function applyTheme() {
  const dark = S.set.theme === 'dark' || (S.set.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  document.documentElement.style.fontSize = (16 * S.set.scale) + 'px';
}
const NAV = [['home', '🏠', 'หน้าแรก'], ['camera', '📷', 'กล้อง'], ['gallery', '🖼️', 'แกลเลอรี'], ['results', '✅', 'ตรวจผล'], ['history', '📊', 'ประวัติ']];
function chrome() {
  const fam = (LOTTO[S.lottery] || {}).sub || S.lottery, chip = (k, label, on) => `<button onclick="A.setLot('${k}')" class="chip border shrink-0 ${on ? 'bg-white text-teal-800 border-white' : 'bg-white/10 text-white border-white/30'}">${label}</button>`;
  const SUBORDER = ['hanoi_ex', 'hanoi_sp', 'hanoi', 'hanoi_vip'], subs = fam === 'hanoi' ? SUBORDER : [];
  $('#chips').innerHTML = `<div class="flex gap-2 overflow-x-auto sb-hide">${Object.entries(LOTTO).filter(([k, l]) => !l.sub).map(([k, l]) => chip(k, l.icon + ' ' + l.name, k === fam)).join('')}</div>`
    + (subs.length ? `<div class="mt-2 rounded-xl bg-white/10 p-2"><div class="text-[11px] text-white/80 mb-1">เลือกประเภทหวยฮานอยที่จะตรวจ</div><div class="flex flex-wrap gap-2">${subs.map(k => chip(k, k === 'hanoi' ? 'หวยฮานอยปกติ' : LOTTO[k].name.replace('ฮานอย', 'หวยฮานอย'), k === S.lottery)).join('')}</div></div>` : '');
  $('#nav > div').innerHTML = NAV.map(([v, i, n]) => `<button onclick="go('${v}')" class="py-2 ${S.view === v ? 'text-teal-600 font-bold' : 'text-slate-500'}"><div class="text-xl">${i}</div>${n}</button>`).join('');
  const un = S.notifs.filter(n => !n.read).length, b = $('#badge'); b.textContent = un; b.classList.toggle('hidden', !un);
  $('#avatar').innerHTML = avatarHTML();
}
function render() { applyTheme(); $('#view').innerHTML = (VIEWS[S.view] || VIEWS.home)(); chrome() }
function go(v) { if (location.hash !== '#' + v) location.hash = v; else route() }
function route() {
  const v = (location.hash || '#home').slice(1);
  if (S.view === 'camera' && v !== 'camera') Cam.stop(true);
  S.view = VIEWS[v] ? v : 'home';
  if (S.view === 'notifs') setTimeout(() => { }, 0);
  render(); window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.set.theme === 'auto') applyTheme() });
addEventListener('pagehide', () => Cam.stop(true));

/* ---------- Boot ---------- */
(function boot() {
  route();
  if (!LS.get('agreed', false)) {
    openModal(`<div class="flex justify-center mb-1"><svg class="w-16 h-16 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LottoSnap"><defs><linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient><linearGradient id="wgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#wbg)"/><!-- viewfinder corners (snap) --><g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".95"><path d="M104 168V132a28 28 0 0 1 28-28H168"/><path d="M344 104H380a28 28 0 0 1 28 28V168"/><path d="M408 344V380a28 28 0 0 1-28 28H344"/><path d="M168 408H132a28 28 0 0 1-28-28V344"/></g><!-- ticket with side notches --><g transform="rotate(-6 256 256)"><path fill="#fff" d="M166 186H346a16 16 0 0 1 16 16V236a20 20 0 0 0 0 40V310a16 16 0 0 1-16 16H166a16 16 0 0 1-16-16V276a20 20 0 0 0 0-40V202a16 16 0 0 1 16-16Z"/><g fill="#0f766e"><circle cx="190" cy="222" r="9"/><circle cx="218" cy="222" r="9"/><circle cx="246" cy="222" r="9"/><circle cx="274" cy="222" r="9"/><circle cx="302" cy="222" r="9"/><circle cx="330" cy="222" r="9"/></g><rect x="180" y="250" width="152" height="10" rx="5" fill="#99f6e4"/><rect x="180" y="274" width="104" height="10" rx="5" fill="#99f6e4"/></g><!-- check badge (result) --><circle cx="336" cy="322" r="52" fill="url(#wgold)" stroke="#fff" stroke-width="10"/><path d="M312 322l18 18 32-38" fill="none" stroke="#0f766e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="font-bold text-lg text-center mb-2">ยินดีต้อนรับสู่ LottoSnap</div>
      <div class="text-sm leading-relaxed">แอปนี้ <b>ฟรี</b> และใช้ <b>ตรวจผลรางวัลเท่านั้น</b> ไม่มีการซื้อขายสลากหรือการพนันใด ๆ ข้อมูลอาจคลาดเคลื่อน โปรดยืนยันกับประกาศอย่างเป็นทางการเสมอ และตรวจเลขที่สแกนได้ให้ตรงกับสลากก่อนกดตรวจ</div>
      <button class="${BP} w-full mt-4" onclick="LS.set('agreed',true);closeModal();addNotif('ยินดีต้อนรับ 👋','เริ่มจากถ่ายภาพสลาก อัปโหลดรูป หรือกรอกเลขได้เลย')">ฉันเข้าใจและยอมรับ</button>`, false);
  }
  if (S.lottery === 'thai') loadHome(); else loadOther(S.lottery);
})();
</script>
